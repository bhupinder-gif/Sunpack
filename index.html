<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunpack Portal</title>
<meta name="description" content="Sunpack Industries Central Business Portal">
<meta name="theme-color" content="#0f2547">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sunpack">
<style>
  html, body { margin: 0; height: 100%; background: #0f2547; overflow: hidden; }
  #app { position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; bottom: 0; width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: #eef2f7; }
  #splash { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f2547; transition: opacity .35s; }
  #splash .tile { width: 104px; height: 104px; border-radius: 24px; background: #fff; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  #splash .tile img { width: 82px; height: 82px; }
  #splash b { margin-top: 18px; color: #f2c14e; font: 700 22px/1.2 "Cinzel", Georgia, serif; letter-spacing: 1.5px; }
  #splash i { margin-top: 4px; color: #fca5ad; font: italic 13px system-ui, sans-serif; }
  #splash .bar { width: 120px; height: 3px; margin-top: 24px; border-radius: 3px; overflow: hidden; background: rgba(255,255,255,.15); }
  #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #e11d2e; animation: run 1.1s infinite ease-in-out; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  .hide { opacity: 0; pointer-events: none; }
  #offline { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 6; display: none; padding: 12px 14px; border-radius: 12px; background: #111827; color: #fff; font: 14px system-ui, sans-serif; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  #offline button { float: right; border: 0; background: #e11d2e; color: #fff; border-radius: 8px; padding: 6px 12px; font: 600 13px system-ui; }
  #lock { position: fixed; inset: 0; z-index: 8; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 0; background: #0f2547; color: #fff; font: 15px system-ui, sans-serif; text-align: center; padding: 24px; }
  #lock.on { display: flex; }
  #lock .tile { width: 88px; height: 88px; border-radius: 20px; background: #fff; display: grid; place-items: center; overflow: hidden; }
  #lock .tile img { width: 80px; height: 80px; }
  #lock b { margin-top: 16px; color: #f2c14e; font: 700 20px/1.2 "Cinzel", Georgia, serif; letter-spacing: 1.2px; }
  #lock p { margin: 10px 0 22px; color: #cdd8ea; max-width: 320px; line-height: 1.45; }
  #lock .fp { width: 76px; height: 76px; border-radius: 50%; border: 2px solid #e11d2e; display: grid; place-items: center; background: rgba(255,255,255,.06); margin-bottom: 18px; }
  #lock .fp svg { width: 40px; height: 40px; stroke: #fff; }
  #lock button { border: 0; border-radius: 12px; padding: 13px 22px; font: 700 15px system-ui; cursor: pointer; margin: 5px; min-width: 210px; }
  #lock .go { background: #e11d2e; color: #fff; } #lock .later { background: transparent; color: #cdd8ea; border: 1px solid rgba(255,255,255,.25); }
  #lock .err { color: #fca5ad; min-height: 20px; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div id="splash"><div class="tile"><img src="icon-192.png" alt="Sunpack"></div><b>SUNPACK INDUSTRIES</b><i>Packaging Freshness</i><div class="bar"></div></div>
<div id="lock"><div class="tile"><img src="icon-192.png" alt="Sunpack"></div><b>SUNPACK</b>
  <p id="lkMsg">Unlock with your fingerprint or face</p>
  <div class="fp"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M12 11v3a8 8 0 0 1-1.5 4.7M8.5 7.6A5 5 0 0 1 17 11v1.5M7 11a5 5 0 0 1 .4-2M7 14.5c.6-1 1-2.2 1-3.5a4 4 0 0 1 8 0v1M15.8 16.5a13 13 0 0 0 .2-2M12.2 19.8c.6-1 1.1-2.2 1.4-3.4M5.5 17.2A9 9 0 0 0 7 14M4 12a8 8 0 0 1 14.8-4.2M20 12c0 .9-.1 1.8-.3 2.6"/></svg></div>
  <button class="go" id="lkGo">Unlock</button><button class="later" id="lkLater">Not now</button>
  <div class="err" id="lkErr"></div></div>
<iframe id="app" title="Sunpack Portal" allow="clipboard-write; camera; geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
<div id="offline"><button onclick="location.reload()">Retry</button>No internet connection. The portal needs internet to load.</div>
<script>
  /* The live portal (Google Apps Script web app). Every module opens inside this app. */
  const BASE = 'https://script.google.com/macros/s/AKfycbx5S1K7UHo1G6y0o2MPoyiBqztkc7vpqUx-vRFJ1-7peyBrmRYxWU2bQhLHde-MZH0t/exec';
  const frame = document.getElementById('app'), splash = document.getElementById('splash'), off = document.getElementById('offline');
  let timer = null;
  function go(u, keepUrl) {
    let x; try { x = new URL(String(u || ''), BASE); } catch (e) { return; }
    x = new URL(x.href.replace(/\/a\/macros\/[^/]+\//, '/macros/').replace(/\/a\/[^/]+\/macros\//, '/macros/'));   // domain-only links → the open link
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(x.href) || x.href.split('?')[0] !== BASE) { window.open(x.href, '_blank', 'noopener'); return; }
    x.searchParams.set('shell', '1');
    splash.classList.remove('hide'); clearTimeout(timer); timer = setTimeout(() => splash.classList.add('hide'), 12000);
    frame.src = x.href;
    if (!keepUrl) { const q = new URLSearchParams(x.search); q.delete('shell'); const s = q.toString(); history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); }
  }
  frame.addEventListener('load', () => { clearTimeout(timer); setTimeout(() => splash.classList.add('hide'), 250); });
  window.addEventListener('message', e => { if (e.data && e.data.sunpackGo) go(e.data.sunpackGo); });
  const start = new URLSearchParams(location.search); const lockCmd = start.get('lock'); ['source', 'lock'].forEach(k => start.delete(k));
  let opened = false;
  const openPortal = () => { lockEl.classList.remove('on'); if (!opened) { opened = true; go(BASE + (start.toString() ? '?' + start.toString() : ''), true); } };

  /* ---------- Fingerprint / face lock (phone's own screen-lock: fingerprint, face or PIN) ----------
     The phone checks the finger / face itself; this app only gets "yes, it is the owner". Turned on once per phone. */
  const lockEl = document.getElementById('lock'), lkMsg = document.getElementById('lkMsg'), lkGo = document.getElementById('lkGo'), lkLater = document.getElementById('lkLater'), lkErr = document.getElementById('lkErr');
  const ls = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
  const b64 = a => btoa(String.fromCharCode(...new Uint8Array(a))), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const rnd = n => crypto.getRandomValues(new Uint8Array(n));
  const canBio = async () => { try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch (e) { return false; } };
  async function verify() {
    const id = ls.get('sp_lock_id');
    await navigator.credentials.get({ publicKey: { challenge: rnd(32), allowCredentials: [{ type: 'public-key', id: unb64(id) }], userVerification: 'required', timeout: 60000 } });
  }
  async function enroll() {
    const c = await navigator.credentials.create({ publicKey: { rp: { name: 'Sunpack Portal' }, user: { id: rnd(16), name: 'sunpack-app', displayName: 'Sunpack app' }, challenge: rnd(32),
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' }, timeout: 60000, attestation: 'none' } });
    ls.set('sp_lock_id', b64(c.rawId)); ls.set('sp_lock_ask', 'done');
  }
  function showLock(mode) {   // mode: 'unlock' | 'offer' | 'off'
    splash.classList.add('hide'); lockEl.classList.add('on'); lkErr.textContent = '';
    lkLater.style.display = mode === 'offer' || mode === 'off' ? '' : 'none';
    lkMsg.textContent = mode === 'offer' ? 'Open Sunpack with your fingerprint or face? Your phone checks it — nothing is sent anywhere.' : mode === 'off' ? 'Confirm with your fingerprint or face to turn the lock off.' : 'Unlock with your fingerprint or face';
    lkGo.textContent = mode === 'offer' ? 'Turn on fingerprint / face lock' : mode === 'off' ? 'Turn lock off' : 'Unlock';
    lkLater.textContent = mode === 'off' ? 'Cancel' : 'Not now';
    lkGo.onclick = async (ev) => { const auto = !ev || !ev.isTrusted; lkErr.textContent = ''; lkGo.disabled = true;
      try { if (mode === 'offer') await enroll(); else await verify();
        if (mode === 'off') ls.set('sp_lock_id', null);
        lastOk = Date.now(); openPortal();
      } catch (e) { if (auto) return; lkErr.textContent = mode === 'offer' ? 'Could not turn it on on this phone. You can still use the app normally.' : 'Not recognised — tap Unlock to try again (your phone PIN also works).'; }
      finally { lkGo.disabled = false; } };
    lkLater.onclick = () => { if (mode === 'offer') ls.set('sp_lock_ask', 'no'); openPortal(); };
    if (mode === 'unlock') setTimeout(() => lkGo.click(), 350);
  }
  let lastOk = 0, hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {   // lock again after 5 minutes away from the app
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (ls.get('sp_lock_id') && hiddenAt && Date.now() - hiddenAt > 5 * 60000) showLock('unlock');
  });
  (async () => {
    const bio = await canBio(), has = !!ls.get('sp_lock_id'), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (lockCmd === 'off' && has) return showLock('off');
    if (has && bio) return showLock('unlock');
    if (bio && !has && (lockCmd === 'on' || (standalone && !ls.get('sp_lock_ask')))) return showLock('offer');
    openPortal();
  })();
  const net = () => { off.style.display = navigator.onLine ? 'none' : 'block'; };
  window.addEventListener('online', () => { net(); }); window.addEventListener('offline', net); net();
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
